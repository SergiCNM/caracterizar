title = "CV parameters"

[parameters]
START_VOLTAGE = 0.0
STOP_VOLTAGE = 0.0
NUM_POINTS = 101
FREQ = 1000
OSC = 500
APERTURE = "5"
POINT_AVERAGE = false
AVERAGE_POINTS = 8
SWEEP_AVERAGE = false
AVERAGE_SWEEPS = 8
GRAPH1 = "CP"
GRAPH2 = "G"
PADS_POSITION = "RF_OFF"
SMU_VOLTAGE = 40.0
ACTIVE_POINTS = 10
INACTIVE_POINTS = 6
TIME_TOTAL = 20.35

[options]
APERTURE = "1,2,3,4,5"
PADS_POSITION = "RF_ON,RF_OFF"

[units]
STEP = "V"
FREQ = "kHz"
OSC = "mV"
SMU_VOLTAGE = "V"

[help]
START_VOLTAGE = "Start voltage from -40V to 40V"
STOP_VOLTAGE = "Stop voltage from -40V to 40V"
FREQ = "Frequency from 20Hz to 20MHz"
OSC = "Oscillation voltage from 5mV to 1000mV"
NUM_POINTS = "Number of points from 2 to 1601"
AVERAGE_POINTS = "Number of points to average from 1 to 999"
AVERAGE_SWEEPS = "Number of sweeps to average from 1 to 999"
APERTURE = "Measurement speed. 1 is the fastest setting."
SMU_VOLTAGE = "Voltage applied to the sample by the SMU"
ACTIVE_POINTS = "Number of points to apply voltage to the sample"
INACTIVE_POINTS = "Number of points to not apply voltage to the sample"
TIME_TOTAL = "Total time of the measurement in seconds"

[output]
separator = "comma"
prefix = "CV_RF"
suffix = ""
variables = ["V", "C", "G"]
