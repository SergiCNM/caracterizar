title = "CV parameters"
width = 350

[parameters]
START = 0.0
STOP = -10.0
FREQ = "10"
NUM_POINTS = 11
LOGFREQ = true
OSC = 500
HYSTERESIS = false
HYSTERESIS_TIME = 1
WAIT_TIME = 5.0
LIGHT = true
LIGHT_TIME = 3
TEMPERATURE = 22.0
AREA = 960400
FIMS = 4.1
PERMITTIVITY = 3.9
SERIAL_RES = false
CALCULATE_PARAMS = false
APERTURE = "5"
POINT_AVERAGE = false
AVERAGE_POINTS = 8
SWEEP_AVERAGE = false
AVERAGE_SWEEPS = 8
GRAPH1 = "CP"
GRAPH2 = "G"
COMPENSATION_OPEN = false
COMPENSATION_SHORT = false
COMPENSATION_DONE = true

[options]
APERTURE = "1,2,3,4,5"
GRAPH1 = "CS,CP"
GRAPH2 = "NONE,G"

[units]
START = "V"
STOP = "V"
STEP = "V"
FREQ = "kHz"
OSC = "mV"
HYSTERESIS_TIME = "s"
WAIT_TIME = "s"
LIGHT_TIME = "s"
TEMPERATURE = "°C"
AREA = "um²"

[help]
START = "Start voltage from -40V to 40V"
STOP = "Stop voltage from -40V to 40V"
FREQ = "Frequency from 20Hz to 20MHz (comma separated values allowed)"
OSC = "Oscillation voltage from 5mV to 1000mV"
NUM_POINTS = "Number of points from 2 to 1601"
AVERAGE_POINTS = "Number of points to average from 1 to 999"
AVERAGE_SWEEPS = "Number of sweeps to average from 1 to 999"
APERTURE = "Measurement speed. 1 is the fastest setting."
CALCULATE_PARAMS = "Calculate parameters"
HYSTERESIS = "Hysteresis"
HYSTERESIS_TIME = "Hysteresis time"
WAIT_TIME = "Wait time"
LIGHT = "Light on/off"
LIGHT_TIME = "Light time"
TEMPERATURE = "Temperature"
AREA = "Area"
FIMS = "FIMS"
PERMITTIVITY = "Permittivity"
SERIAL_RES = "Calculate Serial resistance"
COMPENSATION_OPEN = "Compensate for open circuit"
COMPENSATION_SHORT = "Compensate for short circuit"
COMPENSATION_DONE = "Compensations done"

[output]
separator = "comma"
prefix = "CV"
suffix = ""
variables = ["V", "C", "G"]
