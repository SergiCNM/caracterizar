title = "CW parameters"

[parameters]
START = 1.0
STOP = 1000.0
NUM_POINTS = 101
LOGFREQ = true
SPOT = "-5"
OSC = 30
APERTURE = "5"
POINT_AVERAGE = false
AVERAGE_POINTS = 8
SWEEP_AVERAGE = false
AVERAGE_SWEEPS = 8
WAIT_TIME = 1.0
GRAPH1 = "CP"
GRAPH2 = "G"
COMPENSATION_OPEN = false
COMPENSATION_SHORT = false
COMPENSATION_DONE = false

[options]
APERTURE = "1,2,3,4,5"
GRAPH1 = "CS,CP"
GRAPH2 = "NONE,G"

[units]
START = "kHz"
STOP = "kHz"
STEP = "kHz"
VOLTAGE = "V"
OSC = "mV"
WAIT_TIME = "s"
TEMPERATURE = "°C"
AREA = "um²"

[help]
START = "Start frequency from 20Hz to 20MHz"
STOP = "Stop frequency from 20Hz to 20MHz"
LOGFREQ = "Set Log freq, else Lin freq is selected"
SPOT = "Voltage from -40V to 40V comma separated"
OSC = "Oscillation voltage from 5mV to 1000mV"
NUM_POINTS = "Number of points from 2 to 1601"
AVERAGE_POINTS = "Number of points to average from 1 to 999"
AVERAGE_SWEEPS = "Number of sweeps to average from 1 to 999"
APERTURE = "Measurement speed. 1 is the fastest setting."
WAIT_TIME = "Wait time at beginning of sweep in seconds"
COMPENSATION_OPEN = "Open compensation"
COMPENSATION_SHORT = "Short compensation"
COMPENSATION_DONE = "Compensation done"
