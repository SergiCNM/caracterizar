title = "CW parameters"

[parameters]
START = 1
STOP = 1000
STEP = 1
SPOT = "-20"
OSC = 30
CIRCUIT_MODE = "Parallel"
AVERAGE = true
COMPENSATION_OPEN = false
COMPENSATION_SHORT = false
COMPENSATION_DONE = true

[options]
CIRCUIT_MODE = "Parallel,Series"

[units]
START = "kHz"
STOP = "kHz"
STEP = "kHz"
SPOT = "V"
OSC = "mV"

[help]
START = "Start frequency"
STOP = "Stop frequency"
STEP = "Step frequency"
SPOT = "Spot voltage comma separated"
OSC = "Oscillation voltage"
CIRCUIT_MODE = "Circuit mode"
AVERAGE = "Calculate average"
COMPENSATION_OPEN = "Open compensation"
COMPENSATION_SHORT = "Short compensation"
COMPENSATION_DONE = "Compensation done"

[output]
SEPARATOR = "comma"
PREFIX = "CW"
SUFFIX = ""
VARIABLES = "Freq,C,G"

[plot]
SHOW_PLOT = true
NAME = "Plot CW"
TITLE = "C-W Measurement"
X_VARIABLE = "Freq"
Y1_VARIABLE = "C"
Y2_VARIABLE = "G"
LEFT_LABEL = "Capacitance"
BOTTOM_LABEL = "Frequency"
RIGHT_LABEL = "Conductance"
LEFT_UNITS = "F"
BOTTOM_UNITS = "kHz"
RIGHT_UNITS = "S"
SHOW_GRID = false
LEGEND = true
